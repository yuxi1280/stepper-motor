version: "4.1"
name: EPS
type: ARM
deviceName: null
packDir: null
srcDirs:
  - CMSIS
  - common
  - driver
  - GCC
  - source
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 4fdd57c3c8f9c6607dbe3d57ac97c5f8
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - __DEBUG
        - HC32F460
        - USE_DDL_DRIVER
      incList:
        - CMSIS/Core/Include
        - common
        - driver/inc
        - source
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -D__DEBUG -DHC32F460 -DUSE_DDL_DRIVER
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-0
            signed-char: true
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            misc-control: -fmessage-length=0 -mthumb-interwork -Wall
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $toolName: auto
            output-format: elf
            remove-unused-input-sections: true
            use-float-printf: true
            use-float-scanf: true
        scatterFilePath: GCC/HC32F460xE.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: hc32f460xe
    uploader: pyOCD
  Release:
    cppPreprocessAttrs:
      defineList: []
      incList: []
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            signed-char: true
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control:
              - -fmessage-length=0
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: ""
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
